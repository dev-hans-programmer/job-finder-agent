name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://jobradar:jobradar@localhost:5432/jobradar
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: jobradar, POSTGRES_USER: jobradar, POSTGRES_PASSWORD: jobradar}
        ports: ["5432:5432"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: make migrate
      - run: make check
