name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      TEST_DATABASE_URL: postgresql+asyncpg://jobradar_test:test_password@localhost:5433/jobradar_test
      TEST_REDIS_URL: redis://localhost:6380/1
      DATABASE_URL: postgresql+asyncpg://jobradar_test:test_password@localhost:5433/jobradar_test
      REDIS_URL: redis://localhost:6380/1
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: jobradar_test, POSTGRES_USER: jobradar_test, POSTGRES_PASSWORD: test_password}
        ports: ["5433:5432"]
      redis:
        image: redis:7
        ports: ["6380:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: make test-migrate
      - run: make check
