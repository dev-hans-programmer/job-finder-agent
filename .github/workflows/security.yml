name: Security scanning

on: [push, pull_request]

permissions:
  contents: read

jobs:
  dependency-and-container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Audit Python dependencies
        run: |
          uv export --no-dev --format requirements-txt --no-emit-package job-radar-agent > security-requirements.txt
          uv run --no-project pip-audit --strict -r security-requirements.txt
          rm security-requirements.txt
      - name: Build image for scanning
        run: docker build --tag job-radar-security:${{ github.sha }} .
      - name: Scan container image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: job-radar-security:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
