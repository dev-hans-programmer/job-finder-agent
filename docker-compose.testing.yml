services:
  postgres-testing:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-jobradar_test}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-jobradar_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-test_password}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_POSTGRES_USER:-jobradar_test} -d ${TEST_POSTGRES_DB:-jobradar_test}"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - testing_postgres_data:/var/lib/postgresql/data
  redis-testing:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  testing_postgres_data:
