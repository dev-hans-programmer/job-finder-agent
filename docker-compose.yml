services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobradar
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: jobradar
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobradar -d jobradar"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
  api:
    build: .
    command: python -m app.processes.api
    environment:
      DATABASE_URL: postgresql+asyncpg://jobradar:jobradar@postgres:5432/jobradar
      REDIS_URL: redis://redis:6379/0
      AUTH_REQUIRE_TOKEN: "true"
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: job-radar-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      AUDIT_ARCHIVE_DIR: /backups/audit
    ports:
      - "8000:8000"
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=2
    environment:
      DATABASE_URL: postgresql+asyncpg://jobradar:jobradar@postgres:5432/jobradar
      REDIS_URL: redis://redis:6379/0
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: job-radar-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  scheduler:
    build: .
    command: python -m app.processes.scheduler
    environment:
      DATABASE_URL: postgresql+asyncpg://jobradar:jobradar@postgres:5432/jobradar
      REDIS_URL: redis://redis:6379/0
      SCHEDULER_POLL_SECONDS: "30"
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: job-radar-scheduler
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  flower:
    build: .
    command: celery -A app.workers.celery_app flower --port=5555
    environment:
      DATABASE_URL: postgresql+asyncpg://jobradar:jobradar@postgres:5432/jobradar
      REDIS_URL: redis://redis:6379/0
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: job-radar-flower
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "5555:5555"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  backup:
    build: .
    command: python -m app.processes.backup
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://jobradar:jobradar@postgres:5432/jobradar
      REDIS_URL: redis://redis:6379/0
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: "7"
      BACKUP_INTERVAL_SECONDS: "86400"
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
  tempo:
    image: grafana/tempo:2.7.2
    command: -config.file=/etc/tempo/config.yml
    ports:
      - "3200:3200"
    volumes:
      - ./observability/tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo_data:/var/tempo
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.138.0
    command: ["--config=/etc/otelcol/config.yml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/otel-collector/config.yml:/etc/otelcol/config.yml:ro
    depends_on:
      - tempo
  alloy:
    image: grafana/alloy:v1.10.2
    command: run /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo
volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
  alloy_data:
