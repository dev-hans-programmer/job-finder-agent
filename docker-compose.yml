services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobradar
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: jobradar
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobradar -d jobradar"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
  api:
    build: .
    command: python -m app.processes.api
    environment:
      DATABASE_URL: postgresql+asyncpg://jobradar:jobradar@postgres:5432/jobradar
      REDIS_URL: redis://redis:6379/0
      AUTH_REQUIRE_TOKEN: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=2
    environment:
      DATABASE_URL: postgresql+asyncpg://jobradar:jobradar@postgres:5432/jobradar
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  scheduler:
    build: .
    command: python -m app.processes.scheduler
    environment:
      DATABASE_URL: postgresql+asyncpg://jobradar:jobradar@postgres:5432/jobradar
      REDIS_URL: redis://redis:6379/0
      SCHEDULER_POLL_SECONDS: "30"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  flower:
    build: .
    command: celery -A app.workers.celery_app flower --port=5555
    environment:
      DATABASE_URL: postgresql+asyncpg://jobradar:jobradar@postgres:5432/jobradar
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  postgres_data:
